title = "nixos-remote-builder-liveness-module gitleaks config"

[extend]
useDefault = true

# tests/fixtures/test-ed25519{,-2} are throwaway keypairs generated solely
# for tests/nixos/liveness.nix -- no real-world access, safe to commit. See
# that file's own header comment.
[allowlist]
description = "Throwaway test-only SSH keypairs, not real secrets"
paths = [
  '''tests/fixtures/test-ed25519$''',
  '''tests/fixtures/test-ed25519\.pub$''',
  '''tests/fixtures/test-ed25519-2$''',
  '''tests/fixtures/test-ed25519-2\.pub$''',
]
